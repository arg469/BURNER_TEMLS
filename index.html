<!DOCTYPE html>
<html>
<head>
<title>ARCHIVE</title>

<style>
body{
background:black;
color:#00ff00;
font-family:monospace;
text-align:center;
margin-top:100px;
overflow:hidden;
}

/* glitch animation */
@keyframes glitch {
0% { transform: translate(2px,2px); }
25% { transform: translate(-2px,-2px); }
50% { transform: translate(2px,-2px); }
75% { transform: translate(-2px,2px); }
100% { transform: translate(2px,2px); }
}

.glitch {
animation: glitch 0.2s infinite;
}

/* fullscreen jumpscare */
#scare{
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
z-index:9999;
}
</style>

</head>

<body onclick="start()">

<h1 class="glitch">ARCHIVE TERMINAL</h1>

<p>> Accessing recovered files...</p>
<p>> Data corruption detected...</p>
<p>> Click anywhere to continue</p>

<!-- KEYWORD: SPIDER -->

<img id="scare" src="scare.png">

<audio id="bg">
  <source src="creepy.mp3" type="audio/mpeg">
</audio>

<audio id="scream">
  <source src="scream.mp3" type="audio/mpeg">
</audio>

<script>

function start(){

document.getElementById("bg").play();

// random delay for unpredictability
var delay = Math.floor(Math.random() * 5000) + 3000;

setTimeout(function(){

// flash
document.body.style.background = "white";

setTimeout(()=>{
document.body.style.background = "black";
},100);

// shake
document.body.classList.add("glitch");

// jumpscare
document.getElementById("scare").style.display="block";
document.getElementById("scream").play();

}, delay);

}

</script>

</body>
</html>
