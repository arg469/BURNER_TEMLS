<!DOCTYPE html>
<html>
<head>
<title>SUBJECT_3</title>

<style>
body{
background:black;
color:red;
font-family:monospace;
text-align:center;
overflow:hidden;
}

/* glitch effect */
@keyframes glitch {
0%{transform:translate(0);}
20%{transform:translate(-5px,5px);}
40%{transform:translate(5px,-5px);}
60%{transform:translate(-3px,3px);}
80%{transform:translate(3px,-3px);}
100%{transform:translate(0);}
}

h1{
font-size:50px;
animation:glitch 0.2s infinite;
}

#face{
width:300px;
margin-top:20px;
filter:brightness(0.3) contrast(200%);
}

/* flash */
#flash{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:white;
display:none;
z-index:9999;
}
</style>
</head>

<body>

<h1>SUBJECT_3</h1>

<p id="text">...</p>

<img id="face" src="report3.png">

<div id="flash"></div>

<script>

// text changes
setTimeout(()=>{
document.getElementById("text").innerHTML="you opened it";
},3000);

setTimeout(()=>{
document.getElementById("text").innerHTML="you were not supposed to see this";
},6000);

setTimeout(()=>{
document.getElementById("text").innerHTML="it remembers you";
},9000);

// flash glitch
setInterval(()=>{
if(Math.random() < 0.3){
document.getElementById("flash").style.display="block";
setTimeout(()=>{
document.getElementById("flash").style.display="none";
},100);
}
},2000);

// random scare
setTimeout(()=>{
if(Math.random() < 0.5){
document.body.innerHTML = "<h1>RUN</h1>";
}
},12000);

</script>

<!-- it is not contained -->

</body>
</html>
