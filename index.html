<!DOCTYPE html>
<html>
<head>
<title>ARCHIVE</title>

<style>
body{
background:black;
color:#00ff00;
font-family:monospace;
text-align:center;
margin-top:100px;
}

/* fullscreen jumpscare */
#scare{
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
z-index:9999;
}
</style>

</head>

<body>

<h1>ARCHIVE TERMINAL</h1>

<p>> Click to access system</p>

<button onclick="start()">ACCESS</button>

<img id="scare" src="scare.png">

<audio id="scream">
  <source src="scream.mp3" type="audio/mpeg">
</audio>

<script>

function start(){

var password = prompt("ENTER PASSWORD:");

if(password && password.toUpperCase() == "BURNINGWORLD"){

window.location.href = "files.html";

}
else if(password && password.toUpperCase() == "BURN_CD"){

document.body.innerHTML="<h1>ACCESSING ARCHIVE...</h1>";

setTimeout(()=>{
window.location.href="burn_cd.html";
},2000);

}
else{

document.getElementById("scare").style.display="block";
document.getElementById("scream").play();

}

}

</script>

</body>
</html>
