<!DOCTYPE html>
<html>
<head>
<title>ARCHIVE_TERMINAL</title>

<style>
body{
background:black;
color:#00ff00;
font-family:monospace;
padding:20px;
}

input{
background:black;
color:#00ff00;
border:none;
outline:none;
font-family:monospace;
}

.cursor{
display:inline-block;
width:10px;
background:#00ff00;
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}
</style>
</head>

<body>

<p>> ARCHIVE TERMINAL</p>
<p>> ENTER PASSWORD</p>

<span>> </span>
<input type="text" id="cmd" autofocus>
<span class="cursor"></span>

<p id="output"></p>

<script>

document.getElementById("cmd").addEventListener("keydown", function(e){
if(e.key === "Enter"){
check();
}
});

function check(){

var input = document.getElementById("cmd").value;

if(input == "BURN_CD"){

document.getElementById("output").innerHTML =
"ACCESS GRANTED<br><br>" +
"<a href='files.html'>OPEN FILES</a>";

}else{

document.getElementById("output").innerHTML =
"ACCESS DENIED<br>IT IS NOT SAFE HERE";
document.body.style.background = "darkred";
}

}

</script>

</body>
</html>
