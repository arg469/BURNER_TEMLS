<!DOCTYPE html>
<html>
<head>
<title>CONTAINMENT_PROTOCOL</title>

//start music after user interaction
document.body.addEventListener("click", ()=>{
document.getElementById("bgm").play();
}, { once: true });
  
<style>
body{
background:black;
overflow:hidden;
margin:0;
font-family:monospace;
color:#00ff00;
}
  <audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="spawnSound">
  <source src="spawn.mp3" type="audio/mpeg">
</audio>

#counter{
position:fixed;
top:10px;
left:10px;
}

#timer{
position:fixed;
top:10px;
right:10px;
}

.popup{
position:absolute;
width:120px;
cursor:pointer;
}

/* jumpscare */
#scare{
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
object-fit:cover;
z-index:9999;
}
</style>
</head>

<body>

<h2 id="counter">REMOVED: 0 / 30</h2>
<h2 id="timer">TIME: 25</h2>

<img id="scare" src="scare.png">

<audio id="scream">
<source src="scream.mp3" type="audio/mpeg">
</audio>

<script>

let removed = 0;
let time = 25;

// spawn popup
let img = document.createElement("img");
img.src = "Drawing-13.sketchpad.png";
img.className = "popup";

// 🔊 PLAY SPAWN SOUND
let s = document.getElementById("spawnSound");
s.currentTime = 0;
s.play();

img.style.left = Math.random() * (window.innerWidth - 120) + "px";
img.style.top = Math.random() * (window.innerHeight - 120) + "px";

img.onclick = function(){
img.remove();
removed++;
document.getElementById("counter").innerHTML = "REMOVED: " + removed + " / 13";

if(removed >= 13){
winGame();
}
};

document.body.appendChild(img);
}

// random position
img.style.left = Math.random() * (window.innerWidth - 120) + "px";
img.style.top = Math.random() * (window.innerHeight - 120) + "px";

// click = remove
img.onclick = function(){
img.remove();
removed++;
document.getElementById("counter").innerHTML = "REMOVED: " + removed + " / 30";

// WIN CONDITION 👁️
if(removed >= 30){
winGame();
}
};

document.body.appendChild(img);
}

// spawn repeatedly
let spawner = setInterval(spawnPopup, 1000);

// TIMER ⏱
let countdown = setInterval(()=>{

time--;
document.getElementById("timer").innerHTML = "TIME: " + time;

if(time <= 0){
loseGame();
}

},1000);

// WIN
function winGame(){
clearInterval(spawner);
clearInterval(countdown);

document.body.innerHTML = "<h1 style='color:lime;text-align:center;margin-top:20%;'>CONTAINMENT SUCCESSFUL</h1>";

setTimeout(()=>{
window.location.href = "win.html"; // CHANGE THIS if needed
},3000);
}

// LOSE 💀
function loseGame(){
clearInterval(spawner);
clearInterval(countdown);

document.getElementById("scare").style.display = "block";
document.getElementById("scream").play();

setTimeout(()=>{
window.location.href = "index.html";
},3000);
}

</script>

</body>
</html>
